<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Reader & Live Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  
  <!-- Marked.js for parsing markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljs-theme">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <!-- DOMPurify to sanitize markdown output safely -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.2/dist/purify.min.js"></script>

  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-surface: #1a2234;
      --bg-surface-hover: #222d44;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: #6366f1;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --accent-soft: rgba(99, 102, 241, 0.15);
      --sidebar-width: 260px;
      --font-ui: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-body: 'Newsreader', Georgia, serif;
      --font-sans-body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-surface: #f1f5f9;
      --bg-surface-hover: #e2e8f0;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-focus: #4f46e5;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.1);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Top Navigation Bar */
    header {
      height: 64px;
      padding: 0 1.5rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      z-index: 30;
      backdrop-filter: blur(12px);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: var(--font-ui);
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      background: #4f46e5;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.45);
    }

    .btn-voice {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border-color: transparent;
    }

    .btn-voice.speaking {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .view-toggles {
      display: flex;
      background: var(--bg-surface);
      padding: 3px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
    }

    .view-btn {
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .view-btn.active {
      background: var(--bg-secondary);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    /* Main Container */
    .app-main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Drop Zone Banner */
    .dropzone-overlay {
      position: absolute;
      inset: 0;
      background: rgba(99, 102, 241, 0.9);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      border: 3px dashed #fff;
      pointer-events: none;
    }

    .dropzone-overlay.active {
      display: flex;
    }

    /* Panels */
    .pane {
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }

    .editor-pane {
      width: 50%;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
    }

    .viewer-pane {
      width: 50%;
      background: var(--bg-primary);
      position: relative;
    }

    /* Layout States */
    .layout-split .editor-pane { width: 50%; display: flex; }
    .layout-split .viewer-pane { width: 50%; display: flex; }

    .layout-preview-only .editor-pane { display: none; }
    .layout-preview-only .viewer-pane { width: 100%; }

    .layout-editor-only .editor-pane { width: 100%; }
    .layout-editor-only .viewer-pane { display: none; }

    /* Pane Header */
    .pane-header {
      padding: 0.65rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .pane-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stats-tag {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 500;
      font-family: var(--font-mono);
    }

    /* Editor Textarea */
    #editor {
      flex: 1;
      width: 100%;
      height: 100%;
      padding: 1.25rem;
      background: transparent;
      border: none;
      resize: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      line-height: 1.6;
      tab-size: 2;
    }

    #editor::placeholder {
      color: var(--text-dim);
    }

    /* Markdown Reader Styling */
    .markdown-body {
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 2rem 6rem;
      font-family: var(--font-sans-body);
      color: var(--text-main);
      line-height: 1.75;
      font-size: 1.05rem;
    }

    .markdown-body[data-font="serif"] {
      font-family: var(--font-body);
      font-size: 1.15rem;
      line-height: 1.85;
    }

    /* Typography inside rendered markdown */
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      font-family: var(--font-ui);
      font-weight: 700;
      line-height: 1.3;
      margin-top: 1.8rem;
      margin-bottom: 0.8rem;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .markdown-body h1 {
      font-size: 2.25rem;
      font-weight: 800;
      padding-bottom: 0.6rem;
      border-bottom: 2px solid var(--border-color);
      margin-top: 0.5rem;
    }

    .markdown-body h2 {
      font-size: 1.65rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border-color);
    }

    .markdown-body h3 { font-size: 1.3rem; }
    .markdown-body h4 { font-size: 1.1rem; }

    .markdown-body p {
      margin-bottom: 1.2rem;
      color: var(--text-main);
    }

    .markdown-body a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .markdown-body a:hover {
      color: #818cf8;
    }

    .markdown-body strong {
      font-weight: 700;
      color: var(--text-main);
    }

    .markdown-body em {
      font-style: italic;
    }

    .markdown-body hr {
      height: 1px;
      border: none;
      background: var(--border-color);
      margin: 2rem 0;
    }

    /* Lists */
    .markdown-body ul,
    .markdown-body ol {
      margin-bottom: 1.2rem;
      padding-left: 1.6rem;
    }

    .markdown-body li {
      margin-bottom: 0.4rem;
    }

    .markdown-body li::marker {
      color: var(--accent);
    }

    .markdown-body input[type="checkbox"] {
      margin-right: 0.5rem;
      accent-color: var(--accent);
    }

    /* Blockquotes */
    .markdown-body blockquote {
      margin: 1.5rem 0;
      padding: 0.8rem 1.4rem;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .markdown-body blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Code Blocks */
    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      padding: 0.15rem 0.35rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: #ec4899;
    }

    .code-block-wrapper {
      position: relative;
      margin: 1.5rem 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 1rem;
      background: #1e293b;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: #94a3b8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.15s;
    }

    .copy-btn:hover {
      color: #ffffff;
    }

    .markdown-body pre {
      margin: 0;
      padding: 1.25rem;
      background: #0f172a !important;
      overflow-x: auto;
    }

    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #e2e8f0;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    /* Tables */
    .table-wrapper {
      overflow-x: auto;
      margin: 1.5rem 0;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    .markdown-body th {
      background: var(--bg-surface);
      font-weight: 700;
      padding: 0.85rem 1rem;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-main);
    }

    .markdown-body td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .markdown-body tr:hover td {
      background: var(--bg-surface);
    }

    /* Images */
    .markdown-body img {
      max-width: 100%;
      border-radius: var(--radius-md);
      margin: 1.5rem 0;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    /* Quick TTS Bar Floating Controls */
    .tts-bar {
      position: fixed;
      bottom: 24px;
      right: 28px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(16px);
      z-index: 50;
      transition: all 0.25s ease;
    }

    .tts-bar select {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      outline: none;
      max-width: 140px;
    }

    /* Hidden file input */
    #file-input {
      display: none;
    }

    /* Empty state */
    .empty-prompt {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-dim);
    }

    .empty-prompt svg {
      margin-bottom: 1rem;
      stroke: var(--text-dim);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }

    @media (max-width: 768px) {
      .app-main {
        flex-direction: column;
      }
      .layout-split .editor-pane,
      .layout-split .viewer-pane {
        width: 100%;
        height: 50%;
      }
      .brand-title span {
        display: none;
      }
    }
  </style>
</head>
<body class="layout-split" data-theme="dark">

  <!-- Top Navigation Header -->
  <header>
    <div class="brand-section">
      <div class="brand-logo">MD</div>
      <div class="brand-title">
        Markdown<span>Reader</span>
        <span class="brand-badge">Pro</span>
      </div>
    </div>

    <div class="nav-actions">
      <!-- File Open Button -->
      <button class="btn" id="btn-upload" title="Open .md or .markdown file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Open File
      </button>
      <input type="file" id="file-input" accept=".md,.markdown,.txt" />

      <!-- Sample Loader -->
      <button class="btn" id="btn-sample" title="Load an example formatted markdown file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Sample
      </button>

      <!-- View Switcher -->
      <div class="view-toggles">
        <button class="view-btn" data-layout="editor-only" title="Editor Only">Edit</button>
        <button class="view-btn active" data-layout="split" title="Split View">Split</button>
        <button class="view-btn" data-layout="preview-only" title="Reader View">Read</button>
      </div>

      <!-- Typography Style (Serif / Sans) -->
      <button class="btn" id="btn-font-toggle" title="Toggle Serif / Modern Sans Font">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        Font
      </button>

      <!-- Theme Switcher -->
      <button class="btn" id="btn-theme" title="Toggle Light / Dark mode">
        <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Application Workspace -->
  <main class="app-main" id="drop-target">
    <!-- Drag & Drop Overlay -->
    <div class="dropzone-overlay" id="drop-overlay">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom:12px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Drop .md file here to open instantly
    </div>

    <!-- Left Editor Pane -->
    <section class="pane editor-pane">
      <div class="pane-header">
        <div class="pane-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Markdown Source
        </div>
        <div class="stats-tag" id="editor-stats">0 words · 0 chars</div>
      </div>
      <textarea id="editor" placeholder="Type or paste markdown text here, or drag & drop a .md file..." spellcheck="false"></textarea>
    </section>

    <!-- Right Viewer Pane -->
    <section class="pane viewer-pane" id="viewer-container">
      <div class="pane-header">
        <div class="pane-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          Rendered View
        </div>
        <div class="stats-tag" id="read-time-tag">~0 min read</div>
      </div>
      <div class="markdown-body" id="preview" data-font="sans">
        <div class="empty-prompt">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <h3>No Content Yet</h3>
          <p>Paste text on the left, click Sample, or drag in a Markdown file.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Audio Text-to-Speech Floating Player Bar -->
  <div class="tts-bar" id="tts-bar">
    <button class="btn btn-voice" id="btn-speech" title="Read Aloud with Text-to-Speech">
      <svg id="speech-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <span id="speech-text">Read Aloud</span>
    </button>
    <select id="tts-voice-select" title="Select Voice"></select>
  </div>

  <script>
    // Sample markdown demo content
    const SAMPLE_MARKDOWN = `# 🚀 Welcome to Markdown Reader Pro

A high-performance, beautifully styled Markdown reader that turns raw text and \`.md\` files into a pleasurable reading experience.

---

## ✨ Features at a Glance

- **Instant Parsing**: Lightning-fast markdown rendering with live preview.
- **Audio Read Aloud**: Built-in Text-to-Speech synthesis with voice options.
- **Drag & Drop**: Drop any \`.md\` file anywhere to load it instantly.
- **Syntax Highlighting**: Beautiful code blocks with one-click copy buttons.
- **Reading Time**: Live word count and estimated reading time.
- **Theme Toggles**: Dark/Light modes and Serif/Sans reading typography.

## 💻 Code Demonstration

Here is an example snippet showing how the custom renderer formats code blocks with syntax highlighting:

\`\`\`javascript
// Fetch and render markdown dynamically
async function loadMarkdownDoc(url) {
  try {
    const res = await fetch(url);
    const text = await res.text();
    console.log("Successfully fetched markdown document!");
    return marked.parse(text);
  } catch (err) {
    console.error("Failed to load document:", err);
  }
}

    // DOM Elements
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const editorStats = document.getElementById('editor-stats');
    const readTimeTag = document.getElementById('read-time-tag');
    const fileInput = document.getElementById('file-input');
    const btnUpload = document.getElementById('btn-upload');
    const btnSample = document.getElementById('btn-sample');
    const btnTheme = document.getElementById('btn-theme');
    const btnFontToggle = document.getElementById('btn-font-toggle');
    const viewButtons = document.querySelectorAll('.view-btn');
    const dropTarget = document.getElementById('drop-target');
    const dropOverlay = document.getElementById('drop-overlay');
    const btnSpeech = document.getElementById('btn-speech');
    const speechText = document.getElementById('speech-text');
    const voiceSelect = document.getElementById('tts-voice-select');

    // Configure Marked
    marked.setOptions({
      breaks: true,
      gfm: true,
      highlight: function (code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return hljs.highlight(code, { language: lang }).value;
          } catch (e) {}
        }
        return hljs.highlightAuto(code).value;
      }
    });

    // Custom renderer for code blocks to add copy button and language tag
    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
      const validLang = language && hljs.getLanguage(language) ? language : 'code';
      const highlighted = validLang !== 'code' 
        ? hljs.highlight(code, { language: validLang }).value 
        : hljs.highlightAuto(code).value;

      return `
        <div class="code-block-wrapper">
          <div class="code-block-header">
            <span>${validLang.toUpperCase()}</span>
            <button class="copy-btn" onclick="copyCode(this)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copy
            </button>
          </div>
          <pre><code class="hljs ${validLang}">${highlighted}</code></pre>
        </div>
      `;
    };

    // Wrap tables in responsive wrapper
    renderer.table = function(header, body) {
      return `<div class="table-wrapper"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
    };

    marked.use({ renderer });

    // Global copy code helper
    window.copyCode = function(button) {
      const wrapper = button.closest('.code-block-wrapper');
      const code = wrapper.querySelector('pre code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        const originalText = button.innerHTML;
        button.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          <span style="color:#10b981">Copied!</span>
        `;
        setTimeout(() => {
          button.innerHTML = originalText;
        }, 2000);
      });
    };

    // Render Function
    function render() {
      const rawText = editor.value;

      if (!rawText.trim()) {
        preview.innerHTML = `
          <div class="empty-prompt">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <h3>No Content Yet</h3>
            <p>Paste text on the left, click Sample, or drag in a Markdown file.</p>
          </div>
        `;
        editorStats.innerText = '0 words · 0 chars';
        readTimeTag.innerText = '~0 min read';
        return;
      }

      // Sanitize and Render
      const parsedHtml = marked.parse(rawText);
      preview.innerHTML = DOMPurify.sanitize(parsedHtml, {
        ADD_ATTR: ['target', 'onclick', 'data-font']
      });

      // Update statistics
      const words = (rawText.match(/\b\S+\b/g) || []).length;
      const chars = rawText.length;
      const readMinutes = Math.max(1, Math.ceil(words / 200));

      editorStats.innerText = `${words.toLocaleString()} words · ${chars.toLocaleString()} chars`;
      readTimeTag.innerText = `~${readMinutes} min read`;
    }

    // Input listener
    editor.addEventListener('input', render);

    // File Open
    btnUpload.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        readFile(file);
      }
    });

    function readFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        editor.value = e.target.result;
        render();
      };
      reader.readAsText(file);
    }

    // Drag & Drop
    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      dropOverlay.classList.add('active');
    });

    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragOverlay.classList.remove('active');
        dragCounter = 0;
      }
    });

    window.addEventListener('dragover', (e) => e.preventDefault());

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.remove('active');

      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        readFile(file);
      }
    });

    // Sample Button
    btnSample.addEventListener('click', () => {
      editor.value = SAMPLE_MARKDOWN;
      render();
    });

    // Layout View Switcher
    viewButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        viewButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const layout = btn.getAttribute('data-layout');
        document.body.className = `layout-${layout}`;
      });
    });

    // Font Toggle (Serif vs Modern Sans)
    btnFontToggle.addEventListener('click', () => {
      const current = preview.getAttribute('data-font');
      const next = current === 'serif' ? 'sans' : 'serif';
      preview.setAttribute('data-font', next);
      btnFontToggle.classList.toggle('btn-primary', next === 'serif');
    });

    // Dark / Light Theme Toggle
    btnTheme.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      document.body.setAttribute('data-theme', newTheme);
      
      const hljsTheme = document.getElementById('hljs-theme');
      if (newTheme === 'light') {
        hljsTheme.href = 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css';
      } else {
        hljsTheme.href = 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css';
      }
    });

    // ==========================================
    // Text-to-Speech (Audio Read Aloud Engine)
    // ==========================================
    let synth = window.speechSynthesis;
    let speaking = false;

    function populateVoices() {
      if (!synth) return;
      const voices = synth.getVoices();
      voiceSelect.innerHTML = '';
      
      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.value = index;
        if (voice.default || voice.lang.includes('en')) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      });
    }

    if (synth) {
      populateVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
      }
    }

    btnSpeech.addEventListener('click', () => {
      if (!synth) {
        alert('Text-to-Speech is not supported in this browser.');
        return;
      }

      if (synth.speaking) {
        synth.cancel();
        btnSpeech.classList.remove('speaking');
        speechText.innerText = 'Read Aloud';
        return;
      }

      const text = preview.innerText.trim();
      if (!text) {
        alert('Please enter or load some text to read aloud.');
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      const voices = synth.getVoices();
      if (voices[voiceSelect.value]) {
        utterance.voice = voices[voiceSelect.value];
      }
      utterance.rate = 1.0;

      utterance.onstart = () => {
        btnSpeech.classList.add('speaking');
        speechText.innerText = 'Stop Reading';
      };

      utterance.onend = () => {
        btnSpeech.classList.remove('speaking');
        speechText.innerText = 'Read Aloud';
      };

      utterance.onerror = () => {
        btnSpeech.classList.remove('speaking');
        speechText.innerText = 'Read Aloud';
      };

      synth.speak(utterance);
    });

    // Auto-load sample on startup
    window.addEventListener('DOMContentLoaded', () => {
      editor.value = SAMPLE_MARKDOWN;
      render();
    });
  </script>
</body>
