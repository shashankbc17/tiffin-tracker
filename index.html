<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    
    <!-- Primary SEO & Title -->
    <title>MealSync - Breakfast &amp; Lunch Service Tracker</title>
    <meta name="description" content="Track daily breakfast and lunch service subscriptions, manage cook carry-overs when meals are skipped, calculate per-person rates, and sync with Google Cloud." />
    
    <!-- Prevent stale caching in iframes & browsers so pushes reflect immediately -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- iOS & Android Native PWA Enhancements -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MealSync" />
    <meta name="theme-color" content="#10b981" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Theme initialisation to prevent flash on reload -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tiffin_theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <!-- Trailing slash normalization for iOS PWA Home Screen -->
    <script>
      if (window.location.pathname === '/tiffin-tracker') {
        window.location.replace('/tiffin-tracker/');
      }
    </script>

    <!-- Modern Typography: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
